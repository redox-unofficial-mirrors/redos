[package]
name = "redox_bootloader"
version = "1.0.0"
edition = "2021"

# UEFI uses bin target
[[bin]]
name = "bootloader"
path = "src/main.rs"

# BIOS uses lib target
[lib]
name = "bootloader"
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
bitflags = "1.3.2"
linked_list_allocator = "0.9.1"
log = "0.4.14"
redox_syscall = "0.2.16"
spin = "0.9.2"

[dependencies.redoxfs]
version = "0.5.0"
default-features = false
features = ["force-soft"]

[dependencies.rhai]
version = "1.10"
default-features = false
features = [
  "no_std",
  "no_float", # TODO: can we provide floats?
  "only_i32", # TODO: fix issues with u128
  # Size optimizations
  "no_closure",
  "no_custom_syntax",
  "no_function",
  #"no_index",
  "no_module",
  #"no_object",
  "no_optimize",
  "no_position",
  "unchecked"
]
optional = true

[target.'cfg(target_os = "uefi")'.dependencies]
redox_uefi = "0.1.5"
redox_uefi_std = "0.1.7"

[target."x86_64-unknown-uefi".dependencies]
x86 = "0.47.0"

[features]
default = ["dos", "rhai"]
dos = []
live = []
serial_debug = []

[profile.release]
debug = 2
lto = "thin" # uefi cannot compile with fat lto
opt-level = "s"
panic = "abort"
split-debuginfo = "packed"
