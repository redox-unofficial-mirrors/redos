[package]
name = "redox_bootloader"
version = "1.0.0"
edition = "2021"

# UEFI uses bin target
[[bin]]
name = "bootloader"
path = "src/main.rs"

# BIOS uses lib target
[lib]
name = "bootloader"
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
bitflags = "1.3.2"
redox_syscall = "0.2.16"

[dependencies.linked_list_allocator]
version = "0.10.4"
default-features = false
features = ["const_mut_refs"]

[dependencies.redos_abi]
path = "redos/abi"
default-features = false

[dependencies.redoxfs]
version = "0.5.3"
default-features = false
features = ["force-soft"]

[target.'cfg(target_os = "uefi")'.dependencies]
redox_uefi = "0.1.5"
redox_uefi_std = "0.1.7"

[target."x86_64-unknown-uefi".dependencies]
x86 = "0.47.0"

[features]
default = []
live = []
serial_debug = []

[profile.release]
debug = 2
lto = "thin" # uefi cannot compile with fat lto
opt-level = "s"
panic = "abort"
split-debuginfo = "packed"

[workspace]
members = ["redos/*"]
