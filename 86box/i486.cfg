[General]
vid_renderer = qt_software
confirm_exit = 0

[Machine]
machine = ninja
cpu_family = i486sx
cpu_speed = 25000000
cpu_multi = 1
cpu_use_dynarec = 1
time_sync = local
fpu_softfloat = 0
mem_size = 4096

[Video]
gfxcard = vga

[Input devices]
mouse_type = none

[Sound]
fm_driver = nuked
sndcard = sb16

[Storage controllers]
hdc = internal

[Hard disks]
hdd_01_parameters = 63, 16, 22, 0, ide
hdd_01_fn = ../build/i486-unknown-none/harddrive.bin
hdd_01_speed = ramdisk
hdd_01_ide_channel = 0:0

[Floppy and CD-ROM drives]
fdd_01_type = 525_2qd
fdd_02_type = none

[Other peripherals]
postcard_enabled = 1

[Sound Blaster 16]
base = 0220
base401 = 0330
irq = 5
dma = 1
dma16 = 5
opl = 1
receive_input = 1
receive_input401 = 0
