[General]
vid_renderer = qt_software
confirm_exit = 0

[Machine]
machine = cmdsl386sx25
cpu_family = i386sx
cpu_speed = 25000000
cpu_multi = 1
cpu_use_dynarec = 0
time_sync = local
cpu = 2
mem_size = 4096

[Video]
gfxcard = vga

[Input devices]
mouse_type = none

[Sound]
fm_driver = nuked

[Storage controllers]
hdc = xtide

[Hard disks]
hdd_01_parameters = 63, 16, 22, 0, ide
hdd_01_fn = ../build/i386-unknown-none/harddrive.bin
hdd_01_speed = ramdisk
hdd_01_ide_channel = 0:0

[Floppy and CD-ROM drives]
fdd_01_type = 525_2qd
fdd_02_type = none

[Other peripherals]
postcard_enabled = 1
