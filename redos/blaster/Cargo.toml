[package]
name = "redos_blaster"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/main.rs"
crate-type = ["staticlib"]

[dependencies]
redos_abi = { path = "../abi" }
redos_hw = { path = "../hw" }
redox_hwio = { version = "0.1.6", default-features = false }

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
panic = "abort"
split-debuginfo = "packed"
